<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cloth Simulation</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; background: #1a1a1a; font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Segoe UI', sans-serif; }
      #app { position: relative; width: 100vw; height: 100vh; }
      #canvas { display: block; width: 100%; height: 100%; }
      .controls-panel {
        position: absolute; top: 12px; left: 12px;
        background: rgba(30,30,30,0.92); color: #e0e0e0;
        padding: 12px; border-radius: 8px; min-width: 180px;
        max-width: 280px;
        max-height: calc(100vh - 24px);
        overflow-y: auto;
        display: flex; flex-direction: column; gap: 8px;
        transition: transform 0.3s ease, opacity 0.3s ease;
      }
      .controls-panel.collapsed {
        transform: translateX(-100%);
        opacity: 0;
        pointer-events: none;
      }
      .controls-panel::-webkit-scrollbar {
        width: 8px;
      }
      .controls-panel::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.2);
        border-radius: 4px;
      }
      .controls-panel::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,0.3);
        border-radius: 4px;
      }
      .controls-panel::-webkit-scrollbar-thumb:hover {
        background: rgba(255,255,255,0.4);
      }
      .toggle-panel-btn {
        position: absolute; top: 12px; left: 12px;
        background: rgba(30,30,30,0.92); color: #e0e0e0;
        border: 1px solid #444; border-radius: 4px;
        padding: 8px 12px; cursor: pointer;
        font-size: 12px;
        transition: left 0.3s ease;
        z-index: 10;
      }
      .toggle-panel-btn.panel-visible {
        left: calc(280px + 24px);
      }
      .toggle-panel-btn:hover {
        background: rgba(40,40,40,0.95);
      }
      .controls-panel label { font-size: 12px; color: #aaa; }
      .controls-panel select {
        padding: 6px 8px; background: #2a2a2a; color: #fff;
        border: 1px solid #444; border-radius: 4px; cursor: pointer;
      }
      .controls-panel button {
        padding: 8px 12px; background: #3a7bd5; color: #fff;
        border: none; border-radius: 4px; cursor: pointer;
      }
      .controls-panel button:hover { background: #4a8be5; }
      .controls-panel .stats { font-size: 11px; color: #888; margin-top: 4px; }
      /* Loading overlay – shown until init completes */
      #loading {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #1a1a1a; color: #e0e0e0;
        font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Segoe UI', sans-serif;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      #loading.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
      #loading .spinner {
        width: 48px; height: 48px; margin-bottom: 20px;
        border: 3px solid rgba(255,255,255,0.15);
        border-top-color: #3a7bd5;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #loading .text { font-size: 15px; color: #aaa; margin-bottom: 12px; }
      #loading .progress-bar-wrap {
        width: 220px; height: 6px; background: rgba(255,255,255,0.1);
        border-radius: 3px; overflow: hidden;
      }
      #loading .progress-bar {
        height: 100%; width: 0%; background: #3a7bd5;
        border-radius: 3px; transition: width 0.2s ease;
      }
      #loading .progress-pct { font-size: 14px; color: #888; margin-top: 8px; }

      /* --- Dashboard --- */
      #dashboard {
        display: flex; width: 100vw; height: 100vh;
        background: #1a1a1a; color: #e0e0e0;
        font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Segoe UI', sans-serif;
      }
      #dashboard.hidden { display: none; }
      #app.hidden { display: none; }

      .dash-sidebar {
        width: 220px; min-width: 220px;
        background: #141414; border-right: 1px solid #2a2a2a;
        display: flex; flex-direction: column; padding: 16px 0;
      }
      .dash-sidebar-logo {
        padding: 0 20px 20px; font-size: 18px; font-weight: 700;
        color: #fff; letter-spacing: -0.3px;
      }
      .dash-sidebar-spacer { flex: 1; }
      .dash-sidebar-nav { display: flex; flex-direction: column; gap: 2px; padding: 0 8px; }
      .dash-nav-item {
        display: flex; align-items: center; gap: 10px;
        padding: 8px 12px; border: none; border-radius: 6px;
        background: transparent; color: #999; font-size: 13px;
        cursor: pointer; text-align: left;
      }
      .dash-nav-item:hover { background: #252525; color: #ccc; }
      .dash-nav-item.active { background: #2a2a2a; color: #fff; }

      .dash-main { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
      .dash-settings { padding: 24px 32px; }
      .dash-settings.hidden, .dash-grid.hidden { display: none; }
      .dash-topbar {
        padding: 24px 32px 16px; border-bottom: 1px solid #2a2a2a;
      }
      .dash-title { font-size: 22px; font-weight: 600; color: #fff; margin: 0; }

      .dash-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 20px; padding: 24px 32px;
      }

      .dash-card {
        position: relative;
        background: #222; border: 1px solid #333; border-radius: 10px;
        overflow: hidden; cursor: pointer;
        transition: border-color 0.15s, transform 0.15s;
      }
      .dash-card:hover { border-color: #555; transform: translateY(-2px); }

      .dash-card-new {
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        min-height: 180px; border-style: dashed; border-color: #444;
      }
      .dash-card-new:hover { border-color: #3a7bd5; }
      .dash-card-plus {
        font-size: 36px; color: #555; line-height: 1;
        transition: color 0.15s;
      }
      .dash-card-new:hover .dash-card-plus { color: #3a7bd5; }
      .dash-card-label { font-size: 13px; color: #888; margin-top: 8px; }

      .dash-card-preview {
        height: 120px; background: #1a1a1a;
        display: flex; align-items: center; justify-content: center;
      }
      .dash-card-info { padding: 10px 12px; }
      .dash-card-name {
        font-size: 13px; font-weight: 500; color: #e0e0e0;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .dash-card-date { font-size: 11px; color: #777; margin-top: 4px; }
      .dash-card-badge {
        display: inline-block; font-size: 10px; color: #aaa; background: #2a2a2a;
        padding: 1px 6px; border-radius: 3px; margin-top: 4px;
      }
      .dash-card-delete {
        position: absolute; top: 6px; right: 6px;
        width: 24px; height: 24px; border: none; border-radius: 4px;
        background: rgba(0,0,0,0.5); color: #999;
        font-size: 16px; line-height: 1; cursor: pointer;
        opacity: 0; transition: opacity 0.15s;
        display: flex; align-items: center; justify-content: center;
      }
      .dash-card:hover .dash-card-delete { opacity: 1; }
      .dash-card-delete:hover { background: #c33; color: #fff; }

      .dash-card-rename {
        width: 100%; padding: 2px 4px; font-size: 13px;
        background: #1a1a1a; color: #fff; border: 1px solid #3a7bd5;
        border-radius: 3px; outline: none;
      }

      .dash-card-preset {
        cursor: default;
        border-color: #2a2a2a;
      }
      .dash-card-preset:hover {
        transform: none;
        border-color: #444;
      }

      /* Back button in editor */
      .back-to-dashboard-btn {
        position: absolute; top: 12px; right: 12px;
        background: rgba(30,30,30,0.92); color: #e0e0e0;
        border: 1px solid #444; border-radius: 6px;
        padding: 6px 14px; cursor: pointer; font-size: 12px;
        z-index: 10; display: flex; align-items: center; gap: 6px;
      }
      .back-to-dashboard-btn:hover { background: rgba(50,50,50,0.95); }

      /* --- Pattern / Material Editor --- */
      .editor-root {
        width: 100vw; height: 100vh;
        background: #1a1a1a; color: #e0e0e0;
        font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Segoe UI', sans-serif;
        display: flex; flex-direction: column;
      }
      .editor-root.hidden { display: none; }

      .editor-header {
        display: flex; align-items: center; gap: 16px;
        padding: 12px 20px;
        border-bottom: 1px solid #2a2a2a;
        background: #141414;
      }
      .editor-back-btn {
        background: none; border: 1px solid #444; color: #ccc;
        border-radius: 6px; padding: 6px 14px; cursor: pointer;
        font-size: 12px; white-space: nowrap;
      }
      .editor-back-btn:hover { background: #252525; }
      .editor-save-btn {
        background: #3a7bd5; border: none; color: #fff;
        border-radius: 6px; padding: 6px 18px; cursor: pointer;
        font-size: 12px; font-weight: 600; white-space: nowrap;
      }
      .editor-save-btn:hover { background: #4a8be5; }
      .editor-title {
        background: transparent; border: 1px solid transparent;
        color: #fff; font-size: 16px; font-weight: 600;
        padding: 4px 8px; border-radius: 4px; flex: 1;
        min-width: 0;
      }
      .editor-title:hover { border-color: #444; }
      .editor-title:focus { border-color: #3a7bd5; outline: none; background: #222; }

      .editor-body {
        flex: 1; display: flex; overflow: hidden;
      }
      .editor-sidebar {
        width: 280px; min-width: 280px; min-height: 0;
        padding: 16px; overflow-y: auto;
        border-right: 1px solid #2a2a2a;
        display: flex; flex-direction: column; gap: 12px;
      }
      .editor-field { display: flex; flex-direction: column; gap: 6px; }
      .editor-field label { font-size: 12px; color: #999; }
      .editor-field select {
        padding: 6px 8px; background: #2a2a2a; color: #fff;
        border: 1px solid #444; border-radius: 4px; cursor: pointer; font-size: 13px;
      }
      .editor-field-compact { gap: 4px; }
      .editor-field-compact label { font-size: 11px; color: #777; }

      .editor-slider-row {
        display: flex; align-items: center; gap: 8px;
      }
      .editor-slider-row input[type="range"] { flex: 1; accent-color: #3a7bd5; }
      .editor-num-input {
        width: 60px; padding: 4px 6px;
        background: #2a2a2a; color: #fff; border: 1px solid #444;
        border-radius: 4px; font-size: 12px; text-align: right;
      }

      .editor-color-input {
        width: 100%; height: 36px; border: 1px solid #444;
        border-radius: 4px; cursor: pointer; background: none;
        padding: 2px;
      }

      .editor-preset-row {
        display: flex; flex-wrap: wrap; gap: 6px;
      }
      .editor-preset-btn {
        padding: 4px 10px; border: 1px solid #555; border-radius: 4px;
        font-size: 11px; cursor: pointer;
        transition: border-color 0.15s;
      }
      .editor-preset-btn:hover { border-color: #3a7bd5; }

      .editor-canvas-wrap {
        flex: 1; display: flex; align-items: center; justify-content: center;
        padding: 20px; overflow: hidden;
      }
      .editor-canvas {
        max-width: 100%; max-height: 100%;
        border-radius: 8px;
      }
      .editor-info {
        font-size: 12px; color: #888;
        display: flex; flex-direction: column; gap: 4px;
        padding-top: 8px; border-top: 1px solid #2a2a2a;
      }
      .editor-info strong { color: #ccc; }

      .editor-section {
        border: 1px solid #2a2a2a; border-radius: 6px; overflow: hidden;
        flex-shrink: 0;
      }
      .editor-section-header {
        display: flex; align-items: center; gap: 6px;
        padding: 10px 12px; cursor: pointer; user-select: none;
        background: #1e1e1e; font-size: 13px; font-weight: 600; color: #ccc;
      }
      .editor-section-header:hover { background: #252525; }
      .editor-section-arrow { font-size: 11px; color: #888; width: 12px; }
      .editor-section-body {
        padding: 12px; display: flex; flex-direction: column; gap: 10px;
      }

      /* Editor sidebar scrollbar */
      .editor-sidebar::-webkit-scrollbar { width: 6px; }
      .editor-sidebar::-webkit-scrollbar-track { background: transparent; }
      .editor-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
      .editor-sidebar::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

      /* Dashboard empty state */
      .dash-empty {
        grid-column: 1 / -1; text-align: center;
        padding: 48px 24px; color: #666;
      }
      .dash-empty-icon { font-size: 36px; margin-bottom: 12px; }
      .dash-empty-text { font-size: 14px; }

      /* --- Workspace (Blender-style split panes) --- */
      .workspace-root {
        display: flex; flex-direction: column;
        width: 100vw; height: 100vh; background: #1a1a1a;
      }
      .ws-header {
        display: flex; align-items: center; height: 48px;
        padding: 0 12px; background: #111;
        border-bottom: 1px solid #2a2a2a; gap: 10px; flex-shrink: 0;
      }
      .ws-back-btn {
        background: none; border: 1px solid #444; color: #aaa;
        border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 13px;
      }
      .ws-back-btn:hover { background: #252525; color: #fff; }
      .ws-project-name { flex: 1; font-size: 14px; color: #ccc; font-weight: 500; }
      .ws-body { flex: 1; display: flex; flex-direction: row; overflow: hidden; min-height: 0; }
      .ws-pane {
        display: flex; flex-direction: column;
        min-width: 200px; overflow: hidden; flex: 1;
      }
      .ws-pane-header {
        display: flex; align-items: center; height: 32px;
        background: #1e1e1e; border-bottom: 1px solid #2a2a2a;
        padding: 0 8px; gap: 6px; flex-shrink: 0;
      }
      .ws-type-select {
        flex: 1; background: #2a2a2a; color: #ccc; border: none;
        font-size: 12px; padding: 3px 6px; border-radius: 3px; cursor: pointer;
      }
      .ws-type-select:focus { outline: 1px solid #3a7bd5; }
      .ws-split-btn, .ws-close-btn {
        background: none; border: none; color: #888;
        cursor: pointer; font-size: 14px; padding: 2px 6px; border-radius: 3px;
      }
      .ws-split-btn:hover, .ws-close-btn:hover { background: #333; color: #ccc; }
      .ws-pane-content {
        flex: 1; position: relative; overflow: hidden; min-height: 0;
        display: flex; flex-direction: column;
      }
      /* #app and editors fill the pane content */
      .ws-pane-content #app { width: 100%; height: 100%; position: relative; }
      .ws-pane-content .editor-root { flex: 1; min-height: 0; width: 100%; height: 100%; }
      .ws-divider {
        width: 4px; background: #2a2a2a; cursor: col-resize;
        flex-shrink: 0; transition: background 0.15s;
      }
      .ws-divider:hover, .ws-divider.dragging { background: #3a7bd5; }

      /* ── Blender-style workspace layout ─────────────────────────────────── */
      .workspace-root { display: flex; flex-direction: column; width: 100vw; height: 100vh; background: #1a1a1a; overflow: hidden; }

      /* App header */
      .ws-app-header { height: 36px; background: #111; display: flex; align-items: center;
        padding: 0 10px; gap: 8px; border-bottom: 1px solid #2a2a2a; flex-shrink: 0; }
      .ws-mode-select { background: #2a2a2a; color: #ccc; border: 1px solid #3a3a3a;
        border-radius: 4px; font-size: 12px; padding: 3px 8px; cursor: pointer; }
      .ws-save-btn { background: #2a4a7a; border: none; color: #ccc; border-radius: 4px;
        padding: 4px 12px; font-size: 12px; cursor: pointer; }
      .ws-save-btn:hover { background: #3a5a8a; }

      /* Main area */
      .ws-main { flex: 1; display: flex; flex-direction: row; overflow: hidden; min-height: 0; }
      .ws-outliner { width: 200px; background: #141414; flex-shrink: 0; overflow-y: auto;
        border-right: 1px solid #2a2a2a; transition: width .15s; }
      .ws-outliner.collapsed { width: 0; overflow: hidden; }
      .ws-center { flex: 1; display: flex; flex-direction: row; overflow: hidden; min-height: 0; }
      .ws-properties { width: 260px; background: #141414; flex-shrink: 0; display: flex;
        flex-direction: column; border-left: 1px solid #2a2a2a; transition: width .15s; overflow: hidden; }
      .ws-properties.collapsed { width: 0; }

      /* N-panel tabs */
      .ws-prop-tabs { display: flex; background: #111; border-bottom: 1px solid #2a2a2a; flex-shrink: 0; }
      .ws-prop-tab { flex: 1; background: none; border: none; color: #666; font-size: 14px;
        padding: 6px 0; cursor: pointer; border-bottom: 2px solid transparent; }
      .ws-prop-tab.active { color: #ccc; border-bottom-color: #3a7bd5; }
      .ws-prop-tab:hover { color: #aaa; }
      .ws-prop-content { padding: 8px; }
      .ws-prop-section { margin-bottom: 14px; }
      .ws-prop-section-label { display: block; font-size: 10px; color: #666; text-transform: uppercase;
        letter-spacing: .06em; margin-bottom: 6px; }
      .ws-prop-row { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
      .ws-prop-row label { font-size: 12px; color: #aaa; flex: 1; min-width: 0; }

      /* Outliner */
      .ws-outliner-header { font-size: 10px; color: #555; text-transform: uppercase;
        padding: 8px 10px 3px; letter-spacing: .06em; }
      .ws-outliner-entry { display: flex; align-items: center; gap: 6px; padding: 4px 10px;
        font-size: 12px; color: #aaa; cursor: pointer; user-select: none; }
      .ws-outliner-entry:hover { background: #1e1e1e; }
      .ws-outliner-entry.selected { background: #1e3050; color: #ccc; }
      .ws-outliner-indent { margin-left: 14px; }

      /* Status bar */
      .ws-statusbar { height: 28px; background: #0e0e0e; border-top: 1px solid #1e1e1e;
        display: flex; align-items: center; padding: 0 12px; gap: 12px; flex-shrink: 0; }
      .ws-status-item { font-size: 11px; color: #555; }
    </style>
  </head>
  <body>
    <div id="loading" class="hidden">
      <div class="spinner" aria-hidden="true"></div>
      <p class="text" id="loading-text">Loading…</p>
      <div class="progress-bar-wrap" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
        <div class="progress-bar" id="loading-bar"></div>
      </div>
      <p class="progress-pct" id="loading-pct">0%</p>
    </div>
    <div id="app" class="hidden">
      <canvas id="canvas"></canvas>
<div id="draping-overlay" style="display:none;position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.55);color:#fff;font-size:13px;padding:5px 14px;border-radius:12px;pointer-events:none;z-index:10;white-space:nowrap;">Draping…</div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
